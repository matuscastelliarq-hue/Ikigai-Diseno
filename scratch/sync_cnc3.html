<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sync CNC 3</title>
</head>
<body>
    <h1>Syncing CNC...</h1>
    <pre id="log"></pre>
    <script>
        const log = (msg) => {
            document.getElementById('log').innerHTML += msg + '\n';
            console.log(msg);
        };

        const supabaseUrl = 'https://uweuupdtxzkwiugaackz.supabase.co';
        const supabaseKey = 'sb_publishable_0TuBGwD_SSK4cJVn5G_Hyg_3cubQx1E';

        async function syncCNC() {
            try {
                // 1. Get CNC linea
                let res = await fetch(`${supabaseUrl}/rest/v1/lineas?select=*`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                const lineas = await res.json();
                let cncLinea = lineas.find(l => l.id === 'cnc');
                if (!cncLinea) {
                    log("Linea CNC no encontrada!");
                    return;
                }

                // 2. Delete all existing CNC products to start fresh
                log("Deleteting old CNC products...");
                const delRes = await fetch(`${supabaseUrl}/rest/v1/productos?linea_id=eq.${cncLinea.id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                if (!delRes.ok) {
                    log("Error deleting: " + await delRes.text());
                } else {
                    log("Old CNC products deleted.");
                }

                // 3. Insert new correct ones
                const cncProducts = [
                    { 
                        id: 'cnc-1', 
                        nombre: 'Escritorio Pupitre', 
                        precio: 140000, 
                        medidas: '120 x 60 x a75 cm', 
                        material: 'Terciado Mueblista', 
                        imagenes: ['assets/2. Línea CNC/1. Escritorio Pupitre/Escritorio Pupitre 1.png', 'assets/2. Línea CNC/1. Escritorio Pupitre/Escritorio Pupitre 2.jpg'],
                        planos: 'assets/2. Línea CNC/1. Escritorio Pupitre/Planos escritorio pupitre.jpg'
                    },
                    { 
                        id: 'cnc-2', 
                        nombre: 'Repisa NET', 
                        precio: 100000, 
                        medidas: '100 x 30 x a180 cm', 
                        material: 'Terciado Mueblista', 
                        imagenes: ['assets/2. Línea CNC/2. Repisa NET/Repisa NET 1.png', 'assets/2. Línea CNC/2. Repisa NET/Repisa NET 2.jpg'],
                        planos: 'assets/2. Línea CNC/2. Repisa NET/Planos repisa net.jpg'
                    },
                    { 
                        id: 'cnc-3', 
                        nombre: 'Mesa Triqueta', 
                        precio: 110000, 
                        medidas: '120 x 40 x a45 cm', 
                        material: 'Terciado Mueblista', 
                        imagenes: ['assets/2. Línea CNC/3. Mesa Triqueta/Mesa Triqueta 1.jpg', 'assets/2. Línea CNC/3. Mesa Triqueta/Mesa triqueta 2.png'],
                        planos: 'assets/2. Línea CNC/3. Mesa Triqueta/Planos mesa triqueta.jpg'
                    },
                    { 
                        id: 'cnc-4', 
                        nombre: 'Sitial N', 
                        precio: 60000, 
                        medidas: '45 x 45 x a85 cm', 
                        material: 'Terciado Mueblista', 
                        imagenes: ['assets/2. Línea CNC/4. Sitial N/Sitial N 1.png', 'assets/2. Línea CNC/4. Sitial N/Sitial N2.png'],
                        planos: 'assets/2. Línea CNC/4. Sitial N/Planos sitial n.jpg'
                    }
                ];

                for (let p of cncProducts) {
                    log("Inserting: " + p.nombre);
                    const body = {
                        id: p.id,
                        linea_id: cncLinea.id,
                        nombre: p.nombre,
                        precio: p.precio,
                        medidas: p.medidas,
                        material: p.material,
                        imagenes: p.imagenes
                    };
                    
                    const insertRes = await fetch(`${supabaseUrl}/rest/v1/productos`, {
                        method: 'POST',
                        headers: { 
                            'apikey': supabaseKey, 
                            'Authorization': `Bearer ${supabaseKey}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(body)
                    });
                    
                    if (!insertRes.ok) {
                        log("Error inserting " + p.nombre + ": " + await insertRes.text());
                    } else {
                        log("Success: " + p.nombre);
                    }
                }
                log("SYNC COMPLETE");
            } catch (err) {
                log("EXCEPTION: " + err.message);
            }
        }

        syncCNC();
    </script>
</body>
</html>
